name: Build Docker Image and Windows Executable

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    name: Build Standalone Windows EXE & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Windows Executable
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o supermicro-license-generator.exe main.go

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supermicro-license-generator-windows
          path: supermicro-license-generator.exe

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Supermicro License Generator v1.0.0
          body: |
            ## ⚡ Supermicro License Generator & SUM Activator v1.0.0

            ### 🖥️ Windows Standalone App (.exe)
            - Download `supermicro-license-generator.exe` below.
            - Place it alongside `sum_2.15.0_Win_x86_64` folder containing `sum.exe`.
            - Double-click `supermicro-license-generator.exe` to run.

            ### 🐳 Docker Container
            `docker pull ghcr.io/ttolyanich/supermicro-license-generator:latest`
          files: supermicro-license-generator.exe

  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: string
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LC }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
