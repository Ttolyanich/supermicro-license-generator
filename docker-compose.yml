services:
  supermicro-license-generator:
    # Pull the prebuilt image published by CI to GitHub Container Registry
    # instead of building locally. Update with:  docker compose pull && docker compose up -d
    # (To build from source instead, comment out `image:` and uncomment `build:`.)
    image: ghcr.io/ttolyanich/supermicro-license-generator:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: supermicro-license-generator
    restart: unless-stopped
    # Bound to localhost by default: the activation endpoints can reach any
    # host/credentials you give them, so do not expose them to the network
    # without adding auth. To reach it from other machines, change this to
    # "8080:8080" and set BASIC_AUTH_USER / BASIC_AUTH_PASS below.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NO_BROWSER=1
      - SUM_DATA_DIR=/app/data
      # - BASIC_AUTH_USER=admin
      # - BASIC_AUTH_PASS=change-me
    volumes:
      # Persists a SUM toolchain uploaded via the web UI across image updates.
      - sum_data:/app/data
      # Alternatively, mount an existing SUM instead of uploading it, and set
      # SUM_PATH=/app/sum_tool/sum in the environment block above:
      # - /opt/sum_2.15.0_Linux_x86_64:/app/sum_tool:ro

volumes:
  sum_data:
